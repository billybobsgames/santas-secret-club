
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Santa's Secret North Pole Club | Billy Bob's</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7edda;
      color: #274c43;
      font-family: Georgia, serif;
      text-align: center;
    }
    .card {
      margin: 20px;
      padding: 45px 25px;
      max-width: 480px;
      background: #fffaf0;
      border: 6px double #b5252b;
      border-radius: 18px;
      box-shadow: 0 8px 25px #0002;
    }
    .eyebrow {
      color: #b5252b;
      letter-spacing: 3px;
      font-weight: bold;
    }
    h1 {
      font-size: 36px;
      line-height: 1.15;
    }
    p {
      font-size: 19px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">BILLY BOB'S PRESENTS</div>
    <h1>Santa's Secret<br>North Pole Club</h1>
    <p>You've discovered Santa's secret games clubhouse!</p>
    <p>Our North Pole elves are busy getting everything ready.</p>
    <p><strong>Christmas magic is coming soon!</strong></p>
  </main>
</body>
</html>
