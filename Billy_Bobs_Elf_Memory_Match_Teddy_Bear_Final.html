const wrap=(s,id)=>`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="gl${id}"><stop stop-color="#fff9de"/><stop offset="1" stop-color="#e2c48c"/></radialGradient></defs><circle cx="50" cy="50" r="44" fill="url(#gl${id})" stroke="#b88a46" stroke-width="1.5"/><g fill="#b58c49" opacity=".8"><path d="M13 15l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M83 70l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/></g><g transform="translate(9 8) scale(.82)">${s}</g><path d="M16 81q34 18 68 0" fill="none" stroke="#c49a57" stroke-width="1.5"/></svg>`;
const back=`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 8L62 34 91 38 70 58 75 88 50 74 25 88 30 58 9 38 38 34z" fill="#e7c274" stroke="#fff0c4" stroke-width="3"/><text x="50" y="57" font-size="19" text-anchor="middle" fill="#9a2923" font-family="Georgia" font-weight="bold">BB</text></svg>`;
let soundOn=true,audioCtx=null;
function playSound(kind){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime;const notes=kind==='flip'?[523]:kind==='miss'?[294,262]:kind==='match'?[523,659,784]:[523,659,784,1047,784,1047];notes.forEach((hz,i)=>{const o=audioCtx.createOscillator(),v=audioCtx.createGain();o.type=kind==='miss'?'sine':'triangle';o.frequency.setValueAtTime(hz,t+i*.105);v.gain.setValueAtTime(.0001,t+i*.105);v.gain.exponentialRampToValueAtTime(.09,t+i*.105+.018);v.gain.exponentialRampToValueAtTime(.0001,t+i*.105+.19);o.connect(v);v.connect(audioCtx.destination);o.start(t+i*.105);o.stop(t+i*.105+.2)})}catch(e){}}
document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♪ Sound on':'♪ Sound off';e.currentTarget.setAttribute('aria-pressed',String(soundOn));if(soundOn)playSound('flip')});
let level='easy',cards=[],first=null,locked=false,moves=0,matched=0,startTime=null,timer=null;
const board=document.getElementById('board'),pairEl=document.getElementById('pairs'),moveEl=document.getElementById('moves'),clock=document.getElementById('clock'),message=document.getElementById('message');
const sizes={easy:6,medium:8,hard:10};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clockTick(){if(startTime===null)return;let s=Math.floor((Date.now()-startTime)/1000);clock.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function setup(){clearInterval(timer);startTime=null;clock.textContent='0:00';first=null;locked=false;moves=0;matched=0;moveEl.textContent='0';let n=sizes[level];pairEl.textContent='0/'+n;message.textContent='Find the matching Christmas pictures!';document.getElementById('win').classList.remove('show');board.className='board'+(level==='hard'?' hard':'');cards=shuffle([...Array(n).keys(),...Array(n).keys()].map((id,i)=>({id,i,done:false})));board.innerHTML='';cards.forEach((c,i)=>{let btn=document.createElement('button');btn.className='tile';btn.setAttribute('aria-label','Hidden Christmas card');btn.innerHTML=`<div class="inner"><div class="face back">${back}</div><div class="face front"><img src="${artImages[c.id]}" alt="Vintage Christmas illustration" draggable="false"></div></div>`;btn.addEventListener('click',()=>flip(i,btn));board.appendChild(btn)})}
function flip(i,btn){if(locked||cards[i].done||btn.classList.contains('revealed'))return;if(startTime===null){startTime=Date.now();timer=setInterval(clockTick,250)}playSound('flip');btn.classList.add('revealed');btn.setAttribute('aria-label','Christmas picture');if(first===null){first={i,btn};return}moves++;moveEl.textContent=moves;const prev=first;first=null;if(cards[prev.i].id===cards[i].id){cards[prev.i].done=cards[i].done=true;btn.classList.add('matched');prev.btn.classList.add('matched');matched++;pairEl.textContent=matched+'/'+sizes[level];message.textContent='Lovely match!';playSound('match');if(matched===sizes[level]){clearInterval(timer);clockTick();playSound('win');setTimeout(()=>{document.getElementById('result').textContent='You found all '+matched+' pairs in '+moves+' moves and '+clock.textContent+'!';document.getElementById('win').classList.add('show')},650)}}else{locked=true;message.textContent='Not quite — try again!';playSound('miss');setTimeout(()=>{btn.classList.remove('revealed');prev.btn.classList.remove('revealed');locked=false},850)}}
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b));setup()}));document.getElementById('reset').addEventListener('click',setup);document.getElementById('again').addEventListener('click',setup);setup();
