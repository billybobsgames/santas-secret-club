const board=document.getElementById('board');let index=-1,score=0,locked=false;
function button(label,cls,cb){const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=cb;return b}
function start(){index=0;score=0;render()}
function intro(){board.innerHTML='<div class="start"><div style="font-size:65px">🎄</div><h2 class="big">Ready for a Christmas adventure?</h2><p>Eight questions about the magical characters and places you saw on the Christmas Trail.</p><p>Choose the right answer and collect a ⭐ for each one!</p></div>';board.querySelector('.start').append(button('Start the quiz!','next',start))}
function render(){if(index>=DATA.questions.length){finish();return}locked=false;let q=DATA.questions[index];board.innerHTML='';const meta=document.createElement('div');meta.className='meta';meta.innerHTML=`<span>QUESTION ${index+1} OF 8</span><div class="bar"><div class="fill" style="width:${(index+1)/8*100}%"></div></div><span class="score">⭐ ${score}</span>`;board.append(meta);const h=document.createElement('h2');h.className='question';h.textContent=q.q;board.append(h);if(q.scene){const img=document.createElement('img');img.className='scene';img.src=DATA.images[q.scene];img.alt='Billy Bob’s Christmas Trail illustration';board.append(img)}const choices=document.createElement('div');choices.className=q.pics?'cards':'choices';q.a.forEach((a,i)=>{const b=document.createElement('button');b.className=q.pics?'answer':'choice';if(q.pics){const img=document.createElement('img');img.src=DATA.images[q.pics[i]];img.alt=a;b.append(img);const span=document.createElement('span');span.className='name';span.textContent=a;b.append(span)}else b.textContent=a;b.onclick=()=>select(i,choices);choices.append(b)});board.append(choices)}
function select(i,choices){if(locked)return;locked=true;const q=DATA.questions[index];if(i===q.correct)score++;[...choices.children].forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const f=document.createElement('div');f.className='feedback'+(i===q.correct?'':' bad');f.textContent=i===q.correct?'⭐ Brilliant! That’s right!':'Good try! The answer is: '+q.a[q.correct];board.append(f);board.append(button(index===7?'See my results!':'Next question →','next',()=>{index++;render();window.scrollTo({top:0,behavior:'smooth'})}))}
function finish(){board.innerHTML='';const d=document.createElement('div');d.className='award';d.innerHTML=`<div class="medal">🏆</div><h2>Official Billy Bob’s Christmas Trail Expert!</h2><p>You scored <strong>${score} out of 8</strong> Christmas stars!</p><p>${score===8?'Amazing! You remembered every bit of Christmas magic!':score>=5?'Fantastic exploring! You remembered so much!':'Well done for joining our Christmas adventure!'}</p><p>We hope you had a magical Christmas at Billy Bob’s!</p>`;d.append(button('Play again ↻','next',intro));board.append(d)}
intro();
</script></body></html>
