function intro(){stage=-1;stars=0;app.innerHTML='<div class="spark">✦ ✧ ✦</div><h2>Santa needs a toy fixer!</h2><p>Five unusual toys have arrived at the North Pole workshop. Each one needs a little help.</p><p>Look carefully at each toy and choose the piece that will help it. Every toy is special — just as it is!</p><button class="button" id="start">Open the workshop</button>';document.getElementById('start').onclick=()=>{stage=0;render()}}
function render(){if(stage===5){finale();return}answered=false;const t=parts[stage];app.innerHTML=`<div class="topline"><span>TOY ${stage+1} OF 5</span><span>★ ${stars} fixed</span></div><div class="progress"><div style="width:${stage/5*100}%"></div></div><h2>${t.title}</h2><div class="workbench" id="toy">${`<img class="toyart" src="${toyScenes[stage]}" alt="Vintage Christmas toy with a missing part">`}</div><p>${t.prompt}</p><div class="options" id="opts"></div><div class="status" id="status" aria-live="polite"></div><div id="continue"></div>`;t.opts.forEach(([label,symbol],i)=>{const b=document.createElement('button');b.className='part';b.innerHTML=`<img class="partart" src="${toyChoices[stage][i]}" alt=""><span>${label}</span>`;b.onclick=()=>choose(i);document.getElementById('opts').append(b)})}
function choose(i){if(answered)return;const t=parts[stage],buttons=[...document.querySelectorAll('.part')];if(i!==t.correct){sound(false);buttons[i].classList.add('wrong');document.getElementById('status').textContent='Not quite — try another part!';return}answered=true;stars++;sound(true);buttons.forEach(b=>b.disabled=true);buttons[i].classList.add('right');const toyImg=document.querySelector('#toy .toyart');toyImg.src=repairedScenes[stage];toyImg.alt='The repaired toy with its missing part attached';toyImg.classList.add('glow');document.getElementById('toy').insertAdjacentHTML('beforeend','<div class="repaired">★ Repaired!</div>');document.getElementById('status').textContent='★ '+t.success;const next=document.createElement('button');next.className='button';next.textContent=stage===4?'See your toy fixer award!':'Next toy →';next.onclick=()=>{stage++;render()};document.getElementById('continue').append(next)}
function finale(){app.innerHTML=`<div class="spark">✦ ★ ✦</div><h2>Hooray! You saved Santa’s Misfit Toy Workshop!</h2><p>All five toys are repaired and ready for Christmas!</p><div class="toy-gallery" id="gallery"></div><h2>Official North Pole Toy Repairer</h2><p>★ ★ ★ ★ ★</p><p>You've repaired all five toys! Remember, being different is what makes every toy special.</p><button class="button" id="again">Play again ↻</button>`;const gallery=document.getElementById('gallery');repairedScenes.forEach((src,i)=>{const fig=document.createElement('figure');const im=document.createElement('img');im.src=src;im.alt=parts[i].title+' repaired';fig.append(im);const cap=document.createElement('figcaption');cap.textContent=['Patch','Daisy','Beep-Boop','Chugger','Pip'][i];fig.append(cap);gallery.append(fig)});document.getElementById('again').onclick=intro;sound(true)}

const groups=[['Body',['Teddy','Robot','Bird']],['Head',['Round','Pointy','Fluffy']],['Extra',['Bow tie','Top hat','Star']]];
function drawCustom(){const colors=['#c18a56','#76b3b2','#e6b34b'];let body=finalParts[0]===0?'<ellipse cx="180" cy="164" rx="73" ry="76" fill="#c18a56"/>':finalParts[0]===1?'<rect x="112" y="94" width="136" height="142" rx="18" fill="#76b3b2"/>':'<ellipse cx="180" cy="166" rx="75" ry="74" fill="#e6b34b"/>';let head=finalParts[1]===0?'<circle cx="180" cy="86" r="57" fill="#e7bc87"/>':finalParts[1]===1?'<path d="M180 18L240 125H120Z" fill="#e7bc87"/>':'<path d="M127 117Q88 70 125 45Q120 4 165 30Q210-5 232 43Q274 62 231 116Z" fill="#e7bc87"/>';let extra=finalParts[2]===0?'<path d="M155 141l25 12 25-12-5 28-20-12-20 12z" fill="#c72d34"/>':finalParts[2]===1?'<path d="M145 45V15h70v30h20v12H125V45Z" fill="#343c46"/>':'<path d="M180 12l10 22 25 3-19 17 6 24-22-12-22 12 5-24-19-17 26-3Z" fill="#f6db5c"/>';document.getElementById('customtoy').innerHTML=`<svg viewBox="0 0 360 270"><ellipse cx="180" cy="245" rx="100" ry="10" fill="#486" opacity=".3"/><path d="M120 150L80 188M240 150l40 38" stroke="#88623f" stroke-width="23" stroke-linecap="round"/>${body}${head}<circle cx="161" cy="85" r="6" fill="#342c25"/><circle cx="199" cy="85" r="6" fill="#342c25"/><path d="M165 105q15 15 30 0" stroke="#342c25" fill="none" stroke-width="4"/>${extra}</svg>`;const custom=document.getElementById('custom');custom.innerHTML='';groups.forEach(([label,opts],g)=>{let p=document.createElement('p');p.className='tag';p.textContent=label;custom.append(p);let row=document.createElement('div');row.className='finalchoices';opts.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.className=i===finalParts[g]?'active':'';b.onclick=()=>{finalParts[g]=i;drawCustom()};row.append(b)});custom.append(row)})}
function award(){const names=['Pip','Wiggles','Buttons','Tinsel','Pickles','Bumbleberry'];const name=names[(finalParts[0]*9+finalParts[1]*3+finalParts[2])%names.length];app.innerHTML=`<div class="spark">★ ★ ★</div><h2>Certified North Pole Toy Fixer!</h2><p>You repaired <strong>5 out of 5</strong> misfit toys!</p><p>Meet your new creation: <strong>${name} the Wonder Toy!</strong></p><div class="workbench" id="customtoy"></div><p>Remember: being different is what makes every toy special.</p><button class="button" id="again">Play again ↻</button>`;const keep=app.querySelector('#customtoy');const old=finalParts.slice();keep.innerHTML=`<svg viewBox="0 0 360 270"><text x="180" y="135" text-anchor="middle" font-size="90">★</text><text x="180" y="195" text-anchor="middle" font-size="28" fill="#7b3022">${name}</text></svg>`;document.getElementById('again').onclick=intro;sound(true)}
intro();</script></body></html>
